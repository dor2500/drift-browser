# Builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Drift check these releases (latest.yml) and update themselves.
#
# Triggers:
#   - pushing a version tag:  git tag v0.1.1 && git push --tags
#   - the daily engine watch (engine-watch.yml) after it upgrades Chromium
#   - manually from the Actions tab
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Tag to build
        type: string
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Catches API breaks when the engine watch moves to a new Electron major.
      - run: npm run typecheck

      # Version in package.json must match the tag (vX.Y.Z).
      - name: Check tag matches version
        shell: bash
        run: |
          TAG="${{ inputs.ref || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag $TAG does not match package.json $VERSION"; exit 1; fi

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
