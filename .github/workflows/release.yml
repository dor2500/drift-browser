# Builds Drift for Windows, macOS and Linux and publishes one GitHub Release.
# Installed copies check these releases (latest*.yml) and update themselves.
#
# Triggers:
#   - pushing a version tag:  npm version patch && git push --follow-tags
#   - the daily engine watch (engine-watch.yml) after it upgrades Chromium
#   - manually from the Actions tab (pick a tag)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Tag to build
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.ref || github.ref_name }}

jobs:
  # One draft release that all three builds attach their files to.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag $TAG does not match package.json $VERSION"; exit 1; fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Drift ${TAG#v}" --generate-notes --verify-tag

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Catches API breaks when the engine watch moves to a new Electron major.
      - run: npm run typecheck
      - name: Build
        run: npm run build
      # Drift Sync: embed Firebase client config & optional Google OAuth key when repository secrets are configured (docs/GOOGLE-SYNC.md).
      - name: Firebase & Google Sync configuration
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.DRIFT_FIREBASE_CONFIG }}
          FB_API_KEY: ${{ secrets.DRIFT_FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.DRIFT_FIREBASE_PROJECT_ID }}
          FB_AUTH_DOMAIN: ${{ secrets.DRIFT_FIREBASE_AUTH_DOMAIN }}
          FB_APP_ID: ${{ secrets.DRIFT_FIREBASE_APP_ID }}
          ID: ${{ secrets.DRIFT_GOOGLE_CLIENT_ID }}
          SECRET: ${{ secrets.DRIFT_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            node -e "require('fs').writeFileSync('dist-electron/firebase-config.json', process.env.FIREBASE_JSON)"
          elif [ -n "$FB_API_KEY" ] && [ -n "$FB_PROJECT_ID" ]; then
            node -e "require('fs').writeFileSync('dist-electron/firebase-config.json', JSON.stringify({ apiKey: process.env.FB_API_KEY, projectId: process.env.FB_PROJECT_ID, authDomain: process.env.FB_AUTH_DOMAIN || (process.env.FB_PROJECT_ID + '.firebaseapp.com'), appId: process.env.FB_APP_ID || undefined }))"
          fi
          if [ -n "$ID" ] && [ -n "$SECRET" ]; then
            node -e "require('fs').writeFileSync('dist-electron/google-client.json', JSON.stringify({ clientId: process.env.ID, clientSecret: process.env.SECRET }))"
          fi
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_CSC_LINK: ${{ secrets.DRIFT_CSC_LINK }}
          DRIFT_CSC_KEY_PASSWORD: ${{ secrets.DRIFT_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.DRIFT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DRIFT_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DRIFT_APPLE_TEAM_ID }}
        run: |
          if [ -n "$DRIFT_CSC_LINK" ]; then
            export CSC_LINK="$DRIFT_CSC_LINK"
            export CSC_KEY_PASSWORD="$DRIFT_CSC_KEY_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.target }} --publish always

  # Drift for Android: a signed APK attached to the same release. The key comes
  # from repository secrets so every APK installs over the previous one.
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android 17 QPR2 SDK (GeckoView needs it)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
      - name: Restore signing key
        run: echo "${{ secrets.DRIFT_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/drift.jks"
      - name: Build APK
        working-directory: android
        env:
          DRIFT_KEYSTORE: ${{ runner.temp }}/drift.jks
          DRIFT_KEYSTORE_PASSWORD: ${{ secrets.DRIFT_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --console=plain
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One APK per processor type (each carries one copy of Gecko). 64-bit ARM, nearly every
          # phone, is plain Drift-x.apk and goes up first, so older Drift versions find it first.
          out=android/app/build/outputs/apk/release
          v="${TAG#v}"
          cp "$out/app-arm64-v8a-release.apk" "Drift-$v.apk"
          cp "$out/app-armeabi-v7a-release.apk" "Drift-$v-armeabi-v7a.apk"
          cp "$out/app-x86_64-release.apk" "Drift-$v-x86_64.apk"
          gh release upload "$TAG" "Drift-$v.apk" -R "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "Drift-$v-armeabi-v7a.apk" "Drift-$v-x86_64.apk" -R "$GITHUB_REPOSITORY" --clobber

  # Publish a SHA256SUMS manifest over every release asset so install.sh /
  # install.ps1 can verify a download before running it.
  checksums:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SHA256SUMS to the release
      id-token: write # sign the build-provenance attestation
      attestations: write # record the attestation
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          sha256sum * | sort -k2 > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
      # Cryptographic build-provenance for every release asset, signed by GitHub's
      # OIDC identity. Users can verify a download is a genuine, unmodified build
      # from this repo's workflow with:
      #   gh attestation verify <file> --repo dor2500/drift-browser
      # This gives publisher/build authenticity without a paid code-signing cert.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*

  publish:
    needs: [checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
