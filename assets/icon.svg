<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Drift: a "D" whose straight stroke is a vertical-tab sidebar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a40"/>
      <stop offset="1" stop-color="#0d0e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#8aa4ff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#8aa4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b4c4ff"/>
      <stop offset="0.55" stop-color="#8aa4ff"/>
      <stop offset="1" stop-color="#c6a0f6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#glow)"/>
  <rect x="66" y="66" width="892" height="892" rx="214" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Sidebar (the D's stem) with three tab slots. -->
  <rect x="236" y="262" width="168" height="500" rx="56" fill="url(#ink)"/>
  <rect x="270" y="310" width="100" height="36" rx="18" fill="#0d0e15" opacity="0.55"/>
  <rect x="270" y="368" width="100" height="36" rx="18" fill="#0d0e15" opacity="0.3"/>
  <rect x="270" y="426" width="100" height="36" rx="18" fill="#0d0e15" opacity="0.3"/>

  <!-- The drift: the D's bowl, flowing off the sidebar. -->
  <path d="M470 304 C 700 304 792 400 792 512 C 792 624 700 720 470 720"
        fill="none" stroke="url(#ink)" stroke-width="112" stroke-linecap="round"/>
</svg>
